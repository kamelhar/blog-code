# The vLLM Deployment the article describes, as it runs.
#
# Copied from the private gitops repository that actually deploys it, with the
# home directory generalised. Nothing else is changed: the flags, the probes and
# the resource claim are what produced the numbers in results/.
#
# It expects two things this file does not carry: a Secret named vllm-env holding
# VLLM_API_KEY, and the model on local disk at the hostPath below.
# The Spark's one vLLM: exactly one copy of the model, behind both LiteLLM
# routers. Flags, image and mounts match the Docker launcher it replaces (hosts/spark
# 08-vllm-qwen36.sh), except that it listens on loopback only: every client goes through a router.
# The model is pinned by cimientos hosts/spark/models.lock. Changing flags or the model is a swap:
# Recreate stops this pod before the next starts (no second copy fits in memory), and the routers'
# paid fallback answers meanwhile.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels: {app: vllm}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
    spec:
      runtimeClassName: nvidia
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: vllm/vllm-openai@sha256:c5fa18e5360a929262f55c697ea53d963288535fa0b238c0c47e9267a16e13b9
          command: [vllm, serve]
          args:
            - /models/Qwen3.6-35B-A3B-NVFP4
            # the name clients and the router ask for
            - --served-model-name
            - qwen3.6-35b
            # loopback only: nothing off this machine can reach the server; the router is its client
            - --host
            - 127.0.0.1
            # the router's api_base points here
            - --port
            - "8000"
            # half the unified pool for weights and KV cache; the rest stays for the other GPU workloads and the host
            - --gpu-memory-utilization
            - "0.50"
            # context window; paged attention allocates KV for tokens actually used, not for this maximum
            - --max-model-len
            - "131072"
            # tokens one scheduler step may process, so a long prefill is chunked instead of stalling every decode
            - --max-num-batched-tokens
            - "16384"
            # Raised from 8 on 2026-09-20 after measuring where this box actually
            # saturates. Same prompt, 400 tokens out, one to twelve streams:
            #    1 stream    98.2 tok/s
            #    4 streams  219.5 tok/s
            #    8 streams  353.8 tok/s   <- 3.6x one stream, and the old ceiling
            #   12 streams  295.5 tok/s   <- WORSE: four of them queued behind the 8
            # The drop at twelve is queuing, not the hardware giving up, so the cap
            # was the limit rather than the GPU. PagedAttention allocates KV by the
            # tokens a sequence actually uses, not by --max-model-len, so a higher
            # cap costs nothing until the contexts are genuinely long.
            # One interactive agent uses about a quarter of what the box can do; the
            # headroom is for parallel agents and batch work, not for faster typing.
            - --max-num-seqs
            - "16"
            # the model decides when to call a tool
            - --enable-auto-tool-choice
            # a stable system prompt is not reprocessed on every turn
            - --enable-prefix-caching
            # quantised Mixture-of-Experts kernels
            - --moe-backend
            - marlin
            # faster attention kernels
            - --attention-backend
            - flashinfer
            # faster weight loading from local disk
            - --load-format
            - fastsafetensors
            # roughly doubles the context that fits in the same memory
            - --kv-cache-dtype
            - fp8
            # overlaps the CPU-side scheduling with GPU execution
            - --async-scheduling
            # tool calls arrive as structured blocks, not prose an agent has to parse
            - --tool-call-parser
            - qwen3_xml
            # separates the model's thinking from its answer
            - --reasoning-parser
            - qwen3
            # thinking on by default; measured faster per token than off, since the drafter lands more of repetitive reasoning
            - --default-chat-template-kwargs
            - '{"enable_thinking": true}'
            # multi-token prediction: 2.84 tokens accepted per forward pass, 62% of drafts; a fourth slot would land under half the time
            - --speculative-config
            - '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
          envFrom:
            - secretRef: {name: vllm-env}
          env:
            - {name: NVIDIA_VISIBLE_DEVICES, value: all}
            - {name: NVIDIA_DRIVER_CAPABILITIES, value: "compute,utility"}
          resources:
            # What it holds resident once the model is loaded (kubectl top: ~23 GB, a fraction of a
            # core idle), so the scheduler knows what the node has left; no memory limit, because
            # the model's footprint is the model's and an OOM-kill here loses a 30-minute load.
            requests: {cpu: "2", memory: 24Gi}
            limits: {nvidia.com/gpu: 1}
          startupProbe:
            # Loading 23 GB and compiling can take many minutes; allow up to 30.
            exec:
              command: [python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 180
          readinessProbe:
            exec:
              command: [python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
            periodSeconds: 15
            timeoutSeconds: 8
          livenessProbe:
            # A real completion, not /health: a wedged engine can answer 200 on /health for hours
            # while it serves nothing. The rails:
            # the startupProbe gives the load its time, two failed probes in a row are needed, and
            # probes run every 5 minutes, so a slow moment never restarts a 5-minute reload. The key
            # comes from vllm-env; an unauthorised answer raises too, which a restart cannot fix, so
            # a wrong key shows up as restarts in `kubectl get pods` and in the inference watchdog.
            exec:
              command:
                - python3
                - -c
                - |
                  import json, os, urllib.request
                  req = urllib.request.Request(
                      "http://127.0.0.1:8000/v1/completions",
                      data=json.dumps({"model": "qwen3.6-35b", "prompt": "ping", "max_tokens": 1}).encode(),
                      headers={"Content-Type": "application/json",
                               "Authorization": "Bearer " + os.environ["VLLM_API_KEY"]})
                  body = json.load(urllib.request.urlopen(req, timeout=30))
                  assert body["choices"], body
            periodSeconds: 300
            timeoutSeconds: 40
            failureThreshold: 2
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
            - {name: hf-cache, mountPath: /root/.cache/huggingface}
      volumes:
        - name: models
          hostPath: {path: /home/YOUR-USER/models, type: Directory}
        - name: hf-cache
          hostPath: {path: /home/YOUR-USER/.cache/huggingface, type: DirectoryOrCreate}
