# Ghost 6 dropped SQLite for production, so MySQL 8 is not optional here.
# One replica, one volume, no replication: this backs a single-author blog,
# and the writing itself lives in git (kamelhar/blog content/) so the
# blast radius of losing this is the view counts and the admin's session.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blog-mysql
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 8Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-mysql
spec:
  replicas: 1
  strategy: {type: Recreate}          # one RWO volume; never two pods on it
  selector: {matchLabels: {app.kubernetes.io/name: blog-mysql}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: blog-mysql}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mysql
          image: mysql:8.4
          args: ["--mysql-native-password=ON"]
          ports: [{name: mysql, containerPort: 3306}]
          env:
            - {name: MYSQL_DATABASE, value: ghost}
            - {name: MYSQL_USER, value: ghost}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: blog-db, key: password}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: blog-db, key: root-password}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
          resources:
            requests: {cpu: 50m, memory: 512Mi}
            limits: {memory: 1Gi}
          startupProbe:
            exec: {command: ["mysqladmin", "ping", "-h", "127.0.0.1"]}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["mysqladmin", "ping", "-h", "127.0.0.1"]}
            periodSeconds: 30
          readinessProbe:
            exec: {command: ["mysqladmin", "ping", "-h", "127.0.0.1"]}
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: blog-mysql}
---
apiVersion: v1
kind: Service
metadata:
  name: blog-mysql
spec:
  selector: {app.kubernetes.io/name: blog-mysql}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
